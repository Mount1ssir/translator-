name: Publish Android release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Select the version tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'.*/\1/p" app/build.gradle)
            tag="v$version"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint the Android APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Prepare and verify release assets
        run: |
          set -euo pipefail
          mkdir -p release
          apk="WordBridge-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release/$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt" dump badging "release/$apk" > release/apk-metadata.txt
          grep -F "versionName='${RELEASE_TAG#v}'" release/apk-metadata.txt
          "$tools/apksigner" verify "release/$apk"
          (cd release && sha256sum "$apk" > SHA256SUMS.txt)
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG is already published."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "release/WordBridge-${RELEASE_TAG}.apk" release/SHA256SUMS.txt \
            --verify-tag --prerelease --title "WordBridge $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
